<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار التربية المقارنة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#172033;font-family:Tahoma,Arial,sans-serif;padding:18px;line-height:1.8}
main{max-width:720px;margin:25px auto;background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #17203312}
h1{font-size:25px;margin:0 0 6px}.sub{color:#667085;margin:0 0 20px}.bar{height:9px;background:#e8edf5;border-radius:20px;overflow:hidden;margin:10px 0 20px}#fill{height:100%;width:0;background:#21865b;transition:.2s}
.meta{display:flex;justify-content:space-between;color:#667085;font-size:14px}#kind{display:inline-block;background:#edf3ff;color:#2457a6;padding:4px 12px;border-radius:20px;font-size:13px;margin-bottom:12px}
#question{font-size:19px;font-weight:bold;margin:8px 0 18px}.opt{display:block;border:1px solid #dce2ec;border-radius:12px;padding:12px;margin:10px 0;cursor:pointer}.opt:has(input:checked){border-color:#326bd1;background:#f1f6ff}input{margin-left:9px;accent-color:#326bd1}
button{border:0;border-radius:12px;padding:13px 18px;background:#245fca;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:14px;width:100%}button:disabled{opacity:.4;cursor:not-allowed}#feedback{padding:14px;border-radius:12px;margin-top:15px;background:#f2f4f7;display:none}.good{color:#137447}.bad{color:#b42318}#result{text-align:center;display:none}.score{font-size:42px;color:#168052;font-weight:bold}small{color:#667085}
</style><main>
<h1>📚 اختبار التربية المقارنة</h1><p class="sub">40 سؤالًا • اختيار من متعدد وصح أو خطأ • نتيجة فورية</p>
<div id="quiz"><div class="meta"><span id="counter">السؤال 1 من 40</span><span id="points">النتيجة: 0</span></div><div class="bar"><div id="fill"></div></div><span id="kind">اختيار من متعدد</span><div id="question"></div><div id="options"></div><div id="feedback"></div><button id="submit" disabled>تأكيد الإجابة</button><button id="next" style="display:none">السؤال التالي ←</button></div>
<div id="result"><h2>🎉 انتهى الاختبار!</h2><div class="score" id="finalscore"></div><h3 id="rating"></h3><p id="percent"></p><button onclick="restart()">إعادة الاختبار</button></div>
<small>يمكنك فتح الملف على الهاتف دون إنترنت بعد تنزيله.</small>
</main><script>
const qs=[["يُلقب بأبي التربية المقارنة وصاحب كتاب «خطة ونظرات أولية للعمل في التربية المقارنة» عام 1816م:", ["إسحق كاندل", "مارك أنطوان جوليان", "نيقولاس هانز", "إدموند كنج"], 1, "مارك أنطوان جوليان هو أبو التربية المقارنة."], ["يمثل الإطار الإبستمولوجي / الأيديولوجي الخطوة ..... من خطوات المنهج المقارن:", ["الأولى", "الثانية", "الثالثة", "الرابعة"], 1, "الإطار الإبستمولوجي والأيديولوجي هو الخطوة الثانية."], ["من عرّف التربية المقارنة بأنها الفترة الراهنة من تاريخ التربية أو امتداد تاريخ التربية حتى الوقت الحاضر؟", ["مالينسون", "إسحق كاندل", "بيريدي", "شنايدر"], 1, "صاحب هذا التعريف هو إسحق كاندل."], ["الدراسة التي تتناول النظام التعليمي بالكامل في دولة واحدة وتتجاوز الوصف إلى التفسير والتقويم والتوقع هي:", ["القطرية", "المجالية", "عبر الثقافية", "الدولية"], 0, "الدراسة القطرية تتناول نظام دولة واحدة بصورة شاملة."], ["صدر قانون التربية للأمن القومي في الولايات المتحدة نتيجة إطلاق السوفيت أول سفينة فضاء عام:", ["1945م", "1952م", "1958م", "1967م"], 2, "صدر القانون عام 1958م."], ["القوانين والتشريعات والتقارير الرسمية الصادرة عن وزارة التعليم تعتبر من المصادر:", ["الأولية", "الثانوية", "المساعدة", "الميدانية"], 0, "الوثائق الرسمية الأصلية من المصادر الأولية."], ["من عرّف التربية المقارنة بأنها جغرافيا المدارس السياسية وأكد أنها علم متداخل التخصصات؟", ["بدرو روسيللو", "بيريدي", "لاواريز", "أرنولد"], 1, "الإجابة هي بيريدي."], ["من ميّز بين دراسة نظم التعليم الوصفية والتربية المقارنة التحليلية؟", ["شنايدر", "مالينسون", "كارتر جود", "هانز"], 0, "هذا التمييز يُنسب إلى شنايدر."], ["مقارنة إعداد المعلمين في ألمانيا خلال القرنين التاسع عشر والعشرين تصنف دراسة:", ["قطرية", "مجالية", "عبر تاريخية", "عبر قومية"], 2, "لأن المقارنة تتم عبر فترات زمنية تاريخية."], ["القيمة التربوية التي تعرفنا على تجارب الدول وأحدث الأنماط التربوية هي القيمة:", ["الثقافية", "التاريخية", "السياسية", "النفعية"], 0, "القيمة الثقافية تعرفنا على التجارب والأنماط التربوية."], ["أهم مبرر للتربية المقارنة على الإطلاق في رأي بيريدي هو تحقيق الهدف:", ["العلمي الأكاديمي", "النفعي الإصلاحي", "السياسي", "الحضاري"], 0, "يرى بيريدي أهمية الهدف العلمي الأكاديمي."], ["المصادر التي تتناول الجوانب الاقتصادية والسياسية والجغرافية للمجتمع دون تناول التعليم مباشرة تسمى:", ["الأولية", "الثانوية", "المساعدة", "الرسمية"], 2, "هذه هي المصادر المساعدة."], ["تسمية المدارس الخاصة بأبناء الذوات في إنجلترا بـ Public Schools مثال على مشكلة:", ["جمع المعلومات", "توحيد المصطلحات", "توفر الإحصائيات", "الاختبارات النفسية"], 1, "المصطلح نفسه قد يحمل معنى مختلفًا بين الدول."], ["ما الخطوة الأخيرة من خطوات المنهج المقارن الست؟", ["المقارنة", "التعميم", "التنبؤ", "تفسير الظواهر"], 2, "التنبؤ هو الخطوة السادسة والأخيرة."], ["الدراسات التي تجريها المنظمات الدولية مثل اليونسكو باستخدام استبيانات واختبارات موحدة تسمى:", ["عبر الثقافية", "الدولية", "المجالية", "عبر القومية"], 1, "هي الدراسات الدولية."], ["يفرق بدرو روسيللو بين التربية المقارنة الوصفية والتربية المقارنة ..... التي تجيب عن لماذا؟", ["التاريخية", "التفسيرية", "التطبيقية", "القومية"], 1, "التربية المقارنة التفسيرية تبحث عن أسباب الظواهر."], ["من معايير التقويم في الدراسة القطرية:", ["الأنماط العالمية تاريخيًا", "الأنماط في الدول المتشابهة ثقافيًا", "أهداف السياسات التعليمية القطرية", "جميع ما سبق"], 3, "جميع المعايير المذكورة يمكن الاستناد إليها."], ["الكتب والمقالات التي تنقل عن المصادر الأولية لتبسيطها أو إعادة تنظيمها تعتبر مصادر:", ["أولية", "ثانوية", "مساعدة", "ميدانية"], 1, "المصادر الثانوية تعتمد على المصادر الأولية."], ["أثرت الهزيمة في الحرب العالمية الثانية على إلغاء الروح العسكرية في التعليم في:", ["اليابان وألمانيا", "أمريكا وإنجلترا", "فرنسا وإيطاليا", "روسيا والجزائر"], 0, "اليابان وألمانيا هما الإجابة الصحيحة."], ["كم عدد الخطوات الأساسية للمنهج المقارن؟", ["أربع", "خمس", "ست", "سبع"], 2, "يتكون المنهج المقارن من ست خطوات."], ["التربية المقارنة علم قديم استقرت مناهجه تمامًا ولم يعد حولها جدل.", ["صح", "خطأ"], 1, "خطأ؛ التربية المقارنة حديثة النشأة ومناهجها لا تزال موضع جدل."], ["يعتبر مارك أنطوان جوليان أول من وضع مؤلفًا منهجيًا في التربية المقارنة عام 1816م.", ["صح", "خطأ"], 0, "صح؛ وضع مؤلفه المنهجي عام 1816م."], ["تقتصر الدراسة القطرية على وصف الواقع دون تفسير أو توقع.", ["صح", "خطأ"], 1, "خطأ؛ تتجاوز الوصف إلى التفسير والتقويم والتوقع."], ["يرى بيريدي أن التربية المقارنة مجرد دراسة للفترة المعاصرة من تاريخ التربية.", ["صح", "خطأ"], 1, "خطأ؛ يؤكد أنها علم متداخل التخصصات وليست مجرد دراسة للفترة المعاصرة."], ["الزيارات الميدانية والتعليمية أداة مساعدة تكمل المصادر المطبوعة في البحوث المقارنة.", ["صح", "خطأ"], 0, "صح؛ الزيارات الميدانية تكمل المصادر المطبوعة."], ["لا يوجد فرق في معنى Public Schools بين أمريكا وإنجلترا.", ["صح", "خطأ"], 1, "خطأ؛ في إنجلترا تشير إلى مدارس خاصة بأبناء الطبقات الثرية."], ["الهدف النفعي الإصلاحي للتربية المقارنة هدف متراجع وغير مهم في العالم المعاصر.", ["صح", "خطأ"], 1, "خطأ؛ هو هدف رئيسي ومهم في تطوير السياسات التعليمية."], ["الخطوة الأولى في المنهج المقارن هي صياغة التعميمات.", ["صح", "خطأ"], 1, "خطأ؛ الخطوة الأولى هي مشكلة الدراسة، والتعميم يأتي في الخطوة الخامسة."], ["تتناول المصادر المساعدة النظم المدرسية والأوضاع التعليمية بشكل مباشر.", ["صح", "خطأ"], 1, "خطأ؛ تتناول الجوانب الاقتصادية والسياسية والثقافية وغيرها بصورة غير مباشرة."], ["أكد شنايدر أن الحلول التربوية المستعارة من الخارج يجب فحصها بحذر وعدم تركها للصدفة.", ["صح", "خطأ"], 0, "صح؛ يجب فحص الحلول المستعارة بعناية."], ["الدراسات المجالية أو الإقليمية دراسات وصفية تحليلية تطبق مناهج العلوم الاجتماعية على منطقة جغرافية محددة.", ["صح", "خطأ"], 0, "صح؛ هذا هو المقصود بالدراسات المجالية."], ["التربية المقارنة التفسيرية عند روسيللو تقتصر على وصف الواقع التربوي.", ["صح", "خطأ"], 1, "خطأ؛ تبحث عن أسباب الظواهر وتجيب عن سؤال لماذا؟"], ["توفر الإحصائيات ودقتها من المشكلات التي تواجه الباحثين، خاصة في الدول غير المتقدمة.", ["صح", "خطأ"], 0, "صح؛ نقص البيانات وعدم دقتها من مشكلات البحث المقارن."], ["يرى نيقولاس هانز أن التربية المقارنة دراسة ديناميكية ذات هدف نفعي إصلاحي مستقبلي.", ["صح", "خطأ"], 0, "صح؛ ترتبط عنده بالديناميكية والإصلاح المستقبلي."], ["يمكن تطبيق الاختبارات النفسية مباشرة على مختلف الثقافات دون أي تعديل.", ["صح", "خطأ"], 1, "خطأ؛ يجب تكييف الاختبارات مع ثقافة وبيئة المجتمع."], ["أدى إطلاق أول سفينة فضاء سوفيتية إلى صدور قانون التربية للأمن القومي الأمريكي عام 1958م.", ["صح", "خطأ"], 0, "صح؛ ارتبط القانون بالتحدي الفضائي السوفيتي."], ["يجب على الباحث الالتزام بالموضوعية مع الاحتفاظ بقدر معقول من الذاتية للإحساس بالمشكلة.", ["صح", "خطأ"], 0, "صح؛ الموضوعية لا تمنع الإحساس بالمشكلة البحثية."], ["المصادر الثانوية هي الوثائق الرسمية والقوانين الصادرة مباشرة عن الجهة التي جمعت البيانات.", ["صح", "خطأ"], 1, "خطأ؛ هذه مصادر أولية، أما الثانوية فتنقل عنها."], ["تشمل الدراسة القطرية تقويم أهداف السياسات التعليمية الصريحة والضمنية.", ["صح", "خطأ"], 0, "صح؛ يشمل التقويم الأهداف المعلنة والضمنية."], ["الهدف السياسي للتربية المقارنة يكشف الأهداف والأيديولوجيات والنوايا المعلنة والمستترة للدول.", ["صح", "خطأ"], 0, "صح؛ يكشف الأبعاد السياسية والأيديولوجية."]];let i=0,score=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){let q=qs[i];chosen=null;locked=false;$('counter').textContent=`السؤال ${i+1} من 40`;$('points').textContent=`النتيجة: ${score}`;$('fill').style.width=((i+1)/40*100)+'%';$('kind').textContent=i<20?'اختيار من متعدد':'صح أو خطأ';$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((v,j)=>{let l=document.createElement('label');l.className='opt';let r=document.createElement('input');r.type='radio';r.name='answer';r.value=j;r.onchange=()=>{chosen=j;$('submit').disabled=false};l.append(r,document.createTextNode(v));$('options').append(l)});$('feedback').style.display='none';$('submit').style.display='block';$('submit').disabled=true;$('next').style.display='none';$('next').textContent=i===39?'عرض النتيجة':'السؤال التالي ←'}
$('submit').onclick=()=>{if(chosen===null||locked)return;locked=true;let q=qs[i],ok=chosen===q[2];if(ok)score++;$('points').textContent=`النتيجة: ${score}`;$('feedback').style.display='block';$('feedback').innerHTML=`<b class="${ok?'good':'bad'}">${ok?'إجابة صحيحة! أحسنت 🎉':'إجابة غير صحيحة'}</b><br>الإجابة الصحيحة: <b>${q[1][q[2]]}</b><br>${q[3]}`;$('submit').style.display='none';$('next').style.display='block';$('options').querySelectorAll('input').forEach(x=>x.disabled=true)};
$('next').onclick=()=>{if(i<39){i++;render()}else{$('quiz').style.display='none';$('result').style.display='block';$('finalscore').textContent=score+' / 40';$('percent').textContent='النسبة: '+Math.round(score/40*100)+'%';$('rating').textContent=score>=36?'ممتاز جدًا 🌟':score>=30?'جيد جدًا 👏':score>=24?'جيد 👍':score>=20?'مقبول، راجع بعض النقاط 📚':'تحتاج إلى مراجعة أكثر 💪'}};
function restart(){i=0;score=0;$('quiz').style.display='block';$('result').style.display='none';render()}render();
</script></html>
